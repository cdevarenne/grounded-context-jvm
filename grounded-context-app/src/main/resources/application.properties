# This is a command-line tool, so stdout belongs to the answer and nothing else. A banner or
# an INFO line would corrupt `--json` output and make the two implementations non-interchangeable
# in a demo. Warnings and errors still reach stderr.
spring.main.banner-mode=off
spring.main.web-application-type=none
logging.level.root=WARN
logging.pattern.console=%-5level %logger{0} - %msg%n
